# Training-data preset — for users fine-tuning models
# Redacts ALL PII so training data is safe to share
# Extends defaults.conf

[block]
# No secrets ever
**/.env
**/.env.*
**/credentials*
**/secret*
**/*api_key*
**/*apikey*
**/*.pem
**/*.key
~/.ssh/*
~/.gnupg/*
~/.password-store/*
~/.git-credentials

[local-only]
# Source code with potential secrets — route to local model
**/config/database.yml
**/config/secrets.yml
**/.vscode/settings.json
**/docker-compose.yml
**/docker-compose.yaml

[redact]
# ALL source code gets redacted — strip PII but keep structure
**/*.py
**/*.js
**/*.ts
**/*.go
**/*.rs
**/*.java
**/*.rb
**/*.sh
**/*.yaml
**/*.yml
**/*.json
**/*.toml
**/*.xml
**/*.sql
**/*.csv
**/*.md
**/*.txt
**/*.rst
**/*.log

# Data files — redact PII but keep content shape
**/*.jsonl
**/*.parquet
**/*.tsv

[redaction.patterns]
# Enable ALL patterns — every patternNames entry must be listed here.
ipv4 = true
ipv6 = true
ipv4_private = true
email = true
phone = true
api_key_github = true
api_key_openai = true
api_key_anthropic = true
api_key_aws = true
api_key_google = true
api_key_stripe = true
api_key_slack = true
api_key_gitlab = true
bearer_token = true
jwt = true
private_key = true
mac_address = true
credit_card = true
ssn_us = true
database_connection = true
hostname_internal = true
iban = true
passport = true
high_entropy_secret = true
syslog_hostname = true
passwd_username = true
accesslog_hostname = true
