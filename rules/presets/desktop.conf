# Desktop preset — for Omarchy / personal workstations
# Extends defaults.conf

[redact]
# Desktop apps that may contain PII
~/.config/discord/*
~/.config/Slack/*
~/.config/Code/*           # VS Code settings may contain tokens
~/.config/obsidian/*       # Obsidian vault may contain personal notes

# Chat / communication
~/.config/TelegramDesktop/*

[local-only]
# Photos may contain EXIF GPS data
~/Pictures/*.jpg
~/Pictures/*.png
~/Pictures/*.heic
~/Pictures/*.JPG
~/Pictures/*.PNG

# Downloads may contain anything
~/Downloads/*.pdf
~/Downloads/*.docx

# Obsidian vault — personal notes
~/Documents/Obsidian/**

[block]
# Additional desktop-specific blocks
~/.config/Signal/**
~/.config/WireGuard/**
