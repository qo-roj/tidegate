# Paranoid preset — maximum redaction
# Extends defaults.conf + server.conf
# Use when handling regulated data (GDPR, HIPAA, PCI-DSS)

[block]
# Everything in defaults + all credentials anywhere
**/*credential*
**/*secret*
**/*password*
**/*token*
**/*api_key*
**/*apikey*

[local-only]
# ALL log files — no logs go to cloud, period
/var/log/**
~/.local/state/**
/var/lib/**

# ALL config files
/etc/**
~/.config/**

# ALL home directory files by default
~/**
# (whitelist specific paths as [redact] or [public] to override)

[redact]
# Only explicitly whitelisted paths go to cloud (redacted)
~/projects/*/README.md
~/projects/*/.gitignore
~/projects/*/Makefile

[redaction.patterns]
# Enable ALL patterns — every patternNames entry must be listed here.
ipv4 = true
ipv6 = true
ipv4_private = true
email = true
phone = true
api_key_github = true
api_key_openai = true
api_key_anthropic = true
api_key_aws = true
api_key_aws_secret = true
api_key_google = true
api_key_stripe = true
api_key_slack = true
api_key_gitlab = true
bearer_token = true
jwt = true
private_key = true
mac_address = true
credit_card = true
hostname_internal = true
database_connection = true
ssn_us = true               # Social Security Numbers
iban = true                 # International Bank Account Numbers
passport = true             # Passport numbers
high_entropy_secret = true
syslog_hostname = true
passwd_username = true
accesslog_hostname = true
accesslog_hostname = true
docroot_hostname = true
url_hostname = true
