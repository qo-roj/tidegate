# Server preset — for production / fleet servers
# Extends defaults.conf

[block]
# Server credentials and keys
/etc/ssl/private/*
/etc/bind/rndc.key
/root/.ssh/*
/home/*/.ssh/id_*

# Database credentials
/etc/postgresql/*/main/pg_hba.conf
/etc/mysql/my.cnf
/etc/redis/redis.conf

# Service tokens
/etc/tailscale/tailscaled.state
/etc/restic/*

[local-only]
# All logs — servers have user data in logs
/var/log/**

# Database dumps and exports
/tmp/*.sql
/var/backups/**
~/.local/share/*/dumps/*

# Mail server data
/var/mail/*
/var/vmail/**

# User home directories (may contain PII)
/home/*/mail/*
/home/*/Maildir/**

[redact]
# Configs that reference internal topology
/etc/nginx/sites-enabled/*
/etc/nginx/sites-available/*
/etc/apache2/sites-enabled/*
/etc/caddy/Caddyfile
/etc/haproxy/haproxy.cfg

# Docker compose files may contain secrets
**/docker-compose.yml
**/docker-compose.yaml
**/compose.yml

# Cron jobs may reference internal paths
/etc/cron.d/*
/etc/crontab
/var/spool/cron/**

# ─────────────────────────────────────────────────────
# Command output rules — classify tool/agent command output
# (separate from path-based file rules above)
# ─────────────────────────────────────────────────────
[cmd]
# System logs — contain IPs, usernames
journalctl -u *           = redact
journalctl --since *      = redact
journalctl --since * --until * = redact

# Docker logs may contain user data
docker logs *              = redact

# Process listings may contain secrets in args
ps aux                    = redact
ps -ef                    = redact
ss -tlnp                  = redact
ss -tulnp                 = redact
netstat -tlnp             = redact

# Database queries — never send results to cloud
mysql *                   = local-only
psql *                    = local-only
sqlite3 *                 = local-only
redis-cli *               = local-only

# Block entirely — agents should never read these
cat /etc/shadow           = block
cat /etc/gshadow          = block
cat ~/.ssh/id_*           = block
cat /root/.ssh/id_*       = block

[redaction.patterns]
# Enable server-specific patterns
ipv4_private = true       # 10.*, 172.16-31.*, 192.168.*
hostname_internal = true  # *.local, *.internal, *.lan
database_connection = true  # postgres://user:***@host
accesslog_hostname = true  # vhost in Apache/nginx combined access logs (inherited from defaults; explicit for server deployments)
